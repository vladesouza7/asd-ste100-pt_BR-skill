schema_version: "1.1"
name: descricao-de-ferramenta-burocratica
expected_outcome: |
  A resposta contém apenas o texto reescrito em português do Brasil (sem preâmbulo,
  sem resumo das mudanças, sem tabela), em frases curtas na voz ativa, sem ponto e
  vírgula, sem "o mesmo"/"referido", sem nominalização ("realizar a sincronização"),
  sem gerúndio encadeando. As ressalvas da fonte ficam preservadas: a ferramenta
  "tenta" sincronizar, "pode" resolver o conflito, e artefatos parciais "podem" ser
  gerados em timeout. Nenhum fato novo é acrescentado.
